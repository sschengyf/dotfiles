# One instance. For another user or environment, copy the service with its own
# name, hostname, config and data folder.
services:
  __SERVICE__:
    build: .
    image: __SERVICE__
    hostname: __SERVICE__
    restart: unless-stopped
    environment: {}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    # Longer than the app's own shutdown wait.
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
